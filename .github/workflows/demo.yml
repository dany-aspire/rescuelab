name: Reproducible demonstration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: rescuelab_demo
      POSTGRES_DB: rescuelab
      POSTGRES_USER: rescuelab
      POSTGRES_PASSWORD: ci-demo-only
      DATABASE_URL: postgresql://rescuelab:ci-demo-only@db:5432/rescuelab
      API_PORT: "3000"
      VITE_API_BASE_URL: /api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository checks
        run: npm run check

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start demonstration stack
        run: docker compose up --build --detach --wait --wait-timeout 120

      - name: Verify health, list, create, and reload
        id: create
        run: |
          mkdir -p artifacts
          scripts/smoke-test.sh | tee artifacts/initial-smoke.ndjson
          echo "incident_id=$(node -e 'const fs=require("node:fs"); const lines=fs.readFileSync(process.argv[1], "utf8").trim().split("\n"); process.stdout.write(JSON.parse(lines.at(-1)).value)' artifacts/initial-smoke.ndjson)" >> "$GITHUB_OUTPUT"

      - name: Stop stack without deleting the database volume
        run: docker compose down

      - name: Restart stack with the existing database volume
        run: docker compose up --detach --wait --wait-timeout 120

      - name: Verify persistence after restart
        env:
          INCIDENT_ID: ${{ steps.create.outputs.incident_id }}
        run: scripts/smoke-test.sh "$INCIDENT_ID" | tee artifacts/persistence-smoke.ndjson

      - name: Upload machine-readable smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-evidence
          path: artifacts/*.ndjson
          if-no-files-found: warn

      - name: Show service status and logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Clean up without deleting the database volume
        if: always()
        run: docker compose down
